  <style>
    /* The viewer's sage plate from the very first paint: no white flash, no
       dark splash, no bare "Loading..." text before React mounts. The splash
       below lives inside #root and is replaced the moment the app renders;
       its lime ring sits exactly where every later plate puts it
       (packages/ui/src/relay/relay.css), so nothing jumps. */
    html, body { margin: 0; background: #101817; }
    #lupi-splash { position: fixed; inset: 0; background: #101817; }
    #lupi-splash svg {
      position: absolute; left: 50%; width: 22px; height: 22px; margin-left: -11px; overflow: visible;
      top: calc(50% + min(86vw, 480px, (100vh - 150px) / 0.675) * 0.3375 + 18px);
    }
    @supports (height: 100dvh) {
      #lupi-splash svg { top: calc(50% + min(86vw, 480px, (100dvh - 150px) / 0.675) * 0.3375 + 18px); }
    }
    #lupi-splash circle { fill: none; stroke: #d5ef9c; stroke-width: 1.25; }
    #lupi-splash .track { opacity: .2; }
    #lupi-splash .arc {
      stroke-dasharray: 22 78; stroke-linecap: round; transform-box: fill-box; transform-origin: center;
      animation: lupiSplashTurn 1.4s linear infinite;
    }
    @keyframes lupiSplashTurn { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { #lupi-splash .arc { animation: none; } }
  </style>
</head>
<body>
  <div id="root">
    <div id="lupi-splash" aria-label="Loading Lupi" role="status">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <circle class="track" cx="12" cy="12" r="10" pathLength="100" />
        <circle class="arc" cx="12" cy="12" r="10" pathLength="100" />
      </svg>
    </div>
  </div>
  <script type="module" src="./src/main.tsx"></script>
</body>
