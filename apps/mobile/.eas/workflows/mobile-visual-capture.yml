name: Lupi iOS visual capture

# Reuse an already-successful visual-ios simulator build when only Maestro
# flows, assertions, or receipt scripts changed. Native-code changes still use
# mobile-visual.yml so the app binary is rebuilt before capture.
on:
  workflow_dispatch:
    inputs:
      build_id:
        type: string
        required: true
        description: Existing successful visual-ios EAS build ID

concurrency:
  cancel_in_progress: true
  group: ${{ workflow.filename }}-${{ github.ref }}

jobs:
  capture_native_app:
    name: Capture viewer and native shell on iPhone 16 Plus
    type: maestro
    environment: preview
    env:
      MAESTRO_APP_ID: live.lupi.app.dev
      MAESTRO_LUPI_VIEWER_BROWSER_MANIFEST_URL: https://lupi.live/browser-mcp-manifest.json
      MAESTRO_LUPI_VIEWER_HEALTH_URL: https://lupi.live/health
    params:
      build_id: ${{ inputs.build_id }}
      flow_path: .maestro/visual/caffeine-ready.yml
      device_identifier: iPhone 16 Plus
      maestro_version: 2.7.0
      record_screen: true
      retries: 1
      retry_failed_only: true
