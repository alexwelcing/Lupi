# The Lupi app (D1, D2 as amended): generated on the owner's Mac with XcodeGen,
#   brew install xcodegen; cd apps/apple && xcodegen generate && open Lupi.xcodeproj
# The generated Lupi.xcodeproj and Lupi/Info.plist are not committed; this file
# is the source of truth. Re-run `xcodegen generate` after pulling changes here
# or adding files.
name: Lupi

options:
  bundleIdPrefix: live.lupi
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 26Y4SLFJ4M
    CODE_SIGN_STYLE: Automatic

# Local Swift packages under apps/apple. CI tests each on Linux; Xcode builds
# them for the device here.
packages:
  LupiKit:
    path: LupiKit
  LupiScale:
    path: LupiScale
  LupiGame:
    path: LupiGame
  LupiCloud:
    path: LupiCloud

targets:
  Lupi:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Lupi
        excludes:
          - Info.plist
    dependencies:
      - package: LupiKit
        products: [LupiChem, LupiPlay, LupiData]
      - package: LupiScale
        products: [LupiScaleCore, LupiScale]
      - package: LupiGame
        product: LupiGame
      # The account and sync layer lands in M1; it is linked now so every build
      # compiles it for the device.
      - package: LupiCloud
        products: [LupiAuth, LupiSync]
    info:
      path: Lupi/Info.plist
      properties:
        CFBundleDisplayName: Lupi
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Lupi uses the camera to put molecules in your room, so you can throw them at your walls and stack them on your desk. What the camera sees stays on this device.
        # ARKit is required; LiDAR is not: without it the arena falls back to
        # detected planes (plan §3.3).
        UIRequiredDeviceCapabilities: [arkit]
        UILaunchScreen:
          UIColorName: Sage
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIStatusBarHidden: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_NAME: Lupi
        PRODUCT_BUNDLE_IDENTIFIER: live.lupi.app
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ENABLE_PREVIEWS: YES
        SWIFT_STRICT_CONCURRENCY: complete
