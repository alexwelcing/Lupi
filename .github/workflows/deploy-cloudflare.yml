name: Deploy LUPI to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'apps/mcp-worker/**'
      - 'packages/**'
      - 'scripts/**'
      - 'tools/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch: {}

concurrency:
  group: lupi-cloudflare-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  VITE_FIREBASE_AUTH_DOMAIN: lupi.live
  VITE_FIREBASE_PROJECT_ID: shed-489901
  VITE_FIREBASE_APP_ID: 1:350452481649:web:c12dea9ce6f6ae045065d0
  VITE_FIREBASE_STORAGE_BUCKET: shed-489901.firebasestorage.app
  VITE_FIREBASE_MESSAGING_SENDER_ID: '350452481649'
  VITE_FIREBASE_MEASUREMENT_ID: G-BDBRM73QVJ
  VITE_FIREBASE_ANALYTICS_ENABLED: 'false'
  VITE_FIREBASE_ANALYTICS_CONSENT: denied
  VITE_LUPI_MCP_ENDPOINT: /mcp
  VITE_LUPI_AUTH_FLOW: popup
  VITE_NIST_BASE_URL: https://storage.googleapis.com/shed-489901-nist-demos/nist
  VITE_LUPI_ANALYTICS_URL: /collectAnalytics

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: prod

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Cloudflare deploy configuration
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.LUPI_FIREBASE_WEB_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          missing=0
          for name in VITE_FIREBASE_API_KEY CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::MISSING SECRET: ${name}"
              missing=1
            fi
          done
          exit "$missing"

      - name: Build web app and edge Worker
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.LUPI_FIREBASE_WEB_API_KEY }}
        run: pnpm cloudflare:build

      - name: Test edge Worker
        run: pnpm cloudflare:test

      - name: Deploy Cloudflare edge Worker
        id: deploy_worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/mcp-worker
          wranglerVersion: '4.110.0'
          command: deploy

      - name: Upload Cloudflare secrets
        working-directory: apps/mcp-worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          LUPI_MCP_SHARED_SECRET: ${{ secrets.LUPI_MCP_SHARED_SECRET }}
          RENDERER_TOKEN: ${{ secrets.LUPI_RENDERER_TOKEN }}
        run: |
          if [ -n "$LUPI_MCP_SHARED_SECRET" ]; then
            printf '%s' "$LUPI_MCP_SHARED_SECRET" | npx wrangler@4.110.0 secret put LUPI_MCP_SHARED_SECRET
          fi
          if [ -n "$RENDERER_TOKEN" ]; then
            printf '%s' "$RENDERER_TOKEN" | npx wrangler@4.110.0 secret put RENDERER_TOKEN
          fi

      - name: Smoke deployed Cloudflare Worker
        shell: bash
        env:
          WORKER_URL: ${{ steps.deploy_worker.outputs.deployment-url }}
        run: |
          case "$WORKER_URL" in
            https://*.workers.dev | https://*.workers.dev/)
              WORKER_URL="${WORKER_URL%/}"
              ;;
            *)
              echo "::error::Cloudflare deploy did not return a direct workers.dev URL"
              exit 1
              ;;
          esac

          health_file="$RUNNER_TEMP/lupi-health.json"
          root_file="$RUNNER_TEMP/lupi-root.html"

          for i in $(seq 1 12); do
            if curl -fsS "$WORKER_URL/health" -o "$health_file" \
              && curl -fsS "$WORKER_URL/" -o "$root_file" \
              && HEALTH_FILE="$health_file" ROOT_FILE="$root_file" node -e '
                const fs = require("node:fs");
                const health = JSON.parse(fs.readFileSync(process.env.HEALTH_FILE, "utf8"));
                const root = fs.readFileSync(process.env.ROOT_FILE, "utf8");
                if (health.ready !== true || health.bindings?.webAssets !== true || !root.includes("id=\"root\"")) {
                  process.exit(1);
                }
              '
            then
              echo "Cloudflare Worker smoke passed: $WORKER_URL"
              exit 0
            fi
            sleep 10
          done

          echo "::error::Cloudflare Worker smoke failed: $WORKER_URL"
          exit 1
