name: Deploy LUPI to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'apps/mcp-worker/**'
      - 'packages/**'
      - 'scripts/**'
      - 'tools/**'
      - 'tests/**'
      - 'playwright.config.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch: {}

concurrency:
  group: lupi-cloudflare-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  VITE_FIREBASE_AUTH_DOMAIN: lupi.live
  VITE_FIREBASE_PROJECT_ID: shed-489901
  VITE_FIREBASE_APP_ID: 1:350452481649:web:c12dea9ce6f6ae045065d0
  VITE_FIREBASE_STORAGE_BUCKET: shed-489901.firebasestorage.app
  VITE_FIREBASE_MESSAGING_SENDER_ID: '350452481649'
  VITE_FIREBASE_MEASUREMENT_ID: G-BDBRM73QVJ
  VITE_FIREBASE_ANALYTICS_ENABLED: 'false'
  VITE_FIREBASE_ANALYTICS_CONSENT: denied
  VITE_LUPI_MCP_ENDPOINT: /mcp
  VITE_LUPI_AUTH_FLOW: popup
  VITE_NIST_BASE_URL: https://storage.googleapis.com/shed-489901-nist-demos/nist
  VITE_LUPI_ANALYTICS_URL: /collectAnalytics

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: prod

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Validate Cloudflare deploy configuration
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.LUPI_FIREBASE_WEB_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          missing=0
          for name in VITE_FIREBASE_API_KEY CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::MISSING SECRET: ${name}"
              missing=1
            fi
          done
          exit "$missing"

      - name: Build web app and edge Worker
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.LUPI_FIREBASE_WEB_API_KEY }}
        run: pnpm cloudflare:build

      - name: Test edge Worker
        run: pnpm cloudflare:test

      - name: Deploy Cloudflare edge Worker
        id: deploy_worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/mcp-worker
          wranglerVersion: '4.110.0'
          packageManager: pnpm
          command: deploy

      - name: Upload Cloudflare secrets
        working-directory: apps/mcp-worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          LUPI_MCP_SHARED_SECRET: ${{ secrets.LUPI_MCP_SHARED_SECRET }}
          RENDERER_TOKEN: ${{ secrets.LUPI_RENDERER_TOKEN }}
        run: |
          if [ -n "$LUPI_MCP_SHARED_SECRET" ]; then
            printf '%s' "$LUPI_MCP_SHARED_SECRET" | npx wrangler@4.110.0 secret put LUPI_MCP_SHARED_SECRET
          fi
          if [ -n "$RENDERER_TOKEN" ]; then
            printf '%s' "$RENDERER_TOKEN" | npx wrangler@4.110.0 secret put RENDERER_TOKEN
          fi

      - name: Test deployed Cloudflare UI
        env:
          UI_TEST_URL: ${{ steps.deploy_worker.outputs.deployment-url }}
          UI_TEST_EXPECT_HEALTH: 'true'
        run: pnpm test:ui:deployed

      - name: Upload Playwright diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-cloudflare-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
