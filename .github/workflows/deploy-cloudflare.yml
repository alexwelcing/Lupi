name: Cloudflare production

# A merge to main is the release. Build the web app and the edge Worker,
# deploy with the pinned Wrangler, then confirm https://lupi.live reports the
# deployed commit. Traffic moves in about two minutes; nothing gates it.
# A separate job then runs the four-test release smoke against the live site,
# so a bad release is visible within a few minutes of landing rather than
# holding every merge behind a twelve-minute browser suite.
# The previous owner-only, six-input controller and its weekly reconciliation
# were retired on 2026-09-20 by owner decision.

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: lupi-cloudflare-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  VITE_FIREBASE_AUTH_DOMAIN: lupi.live
  VITE_FIREBASE_PROJECT_ID: shed-489901
  VITE_FIREBASE_APP_ID: 1:350452481649:web:c12dea9ce6f6ae045065d0
  VITE_FIREBASE_STORAGE_BUCKET: shed-489901.firebasestorage.app
  VITE_FIREBASE_MESSAGING_SENDER_ID: '350452481649'
  VITE_FIREBASE_MEASUREMENT_ID: G-BDBRM73QVJ
  VITE_FIREBASE_ANALYTICS_ENABLED: 'false'
  VITE_FIREBASE_ANALYTICS_CONSENT: denied
  VITE_LUPI_MCP_ENDPOINT: /mcp
  VITE_LUPI_ANALYTICS_URL: /collectAnalytics
  VITE_LUPI_AUTH_FLOW: popup
  VITE_NIST_BASE_URL: https://storage.googleapis.com/shed-489901-nist-demos/nist

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: lupi-production-write-v2
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app and edge Worker
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.LUPI_FIREBASE_WEB_API_KEY }}
          VITE_LUPI_BUILD_SHA: ${{ github.sha }}
        run: |
          test -n "$VITE_FIREBASE_API_KEY"
          pnpm build

      - name: Install the pinned Wrangler
        run: npm ci --ignore-scripts --omit=dev --prefix .github/wrangler-runtime

      - name: Deploy lupi-edge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.LUPI_CLOUDFLARE_WRITE_TOKEN_V2 }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          # keep_vars preserves the previous release's LUPI_BUILD_SHA, and the
          # Worker prefers that var over version metadata, so set it explicitly.
          node .github/wrangler-runtime/node_modules/wrangler/bin/wrangler.js deploy \
            --config apps/mcp-worker/wrangler.toml \
            --var "LUPI_BUILD_SHA:${GITHUB_SHA}"

      - name: Confirm lupi.live serves this commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const expected = process.env.EXPECTED_SHA;
          let last = null;
          for (let attempt = 1; attempt <= 12; attempt += 1) {
            const response = await fetch('https://lupi.live/health', { headers: { accept: 'application/json' } });
            const body = await response.json().catch(() => null);
            last = { status: response.status, tag: body?.release?.tag ?? null, jev: body?.jev ?? null };
            if (response.ok && last.tag === expected) break;
            await new Promise((resolve) => setTimeout(resolve, 5000));
          }
          console.log(JSON.stringify(last));
          assert.equal(last?.status, 200, 'health route is not answering 200');
          assert.equal(last?.tag, expected, 'lupi.live is not serving the deployed commit yet');
          NODE

  smoke:
    # Runs after traffic has moved and holds no production credentials. It is
    # the fast read on the real site, not a gate: a failure here means roll
    # forward or back, and the run stays red so it is not missed.
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Release smoke against lupi.live
        env:
          UI_TEST_URL: https://lupi.live
          UI_TEST_EXPECT_HEALTH: 'true'
        run: pnpm test:ui:release

      - name: Upload Playwright diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
