name: Apple packages

# The native app (apps/apple) is built and signed on the owner's Mac (D2 as
# amended 2026-10-04), so CI covers only what Linux can prove: every pure-Swift
# package's tests and that the app's own sources parse and type-check against
# stand-ins for Apple's frameworks, on Apple pull requests only. The release
# builds (LupiScale's 8 ms buildCut gate) and `pnpm apple:check` (the Swift
# generated from the web's TypeScript is current) are local tools.

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - 'apps/apple/**'
      - 'tools/apple/**'
      - '.github/workflows/apple.yml'

concurrency:
  group: lupi-apple-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  swift-packages:
    name: Swift packages on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      # swift:6.4.0-noble, pinned by digest like the repo's actions.
      image: swift:6.4.0-noble@sha256:31d14d727f4451f25e29bac9c42563a098c39ac66415e8bad970f48038e38aca
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # The app (apps/apple/Lupi) builds only in Xcode. `swiftc -parse` resolves
      # no imports, so this catches syntax errors in its sources, not type errors.
      - name: Parse the app sources
        run: sh tools/apple/parse-app.sh

      - name: Test native build identity and diagnostics
        run: sh tools/apple/test-build-diagnostics.sh

      # Every package under apps/apple is tested, so a new one is covered
      # without editing this file.
      - name: Test every package
        run: |
          set -eu
          found=0
          for manifest in apps/apple/*/Package.swift; do
            [ -f "$manifest" ] || continue
            dir=$(dirname "$manifest")
            found=$((found + 1))
            echo "::group::swift test ${dir}"
            swift test --package-path "$dir"
            echo "::endgroup::"
          done
          if [ "$found" -eq 0 ]; then
            echo "no Swift packages found under apps/apple" >&2
            exit 1
          fi

      # The app against stand-ins for the Apple frameworks, spelled as Apple
      # documents them, over the packages' real modules: catches the app calling
      # a package API that changed, which parsing cannot.
      - name: Type-check the app against stand-ins
        run: sh tools/apple/typecheck-app.sh
