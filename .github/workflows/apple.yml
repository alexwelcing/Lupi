name: Apple packages

# The native app (apps/apple) is built and signed on the owner's Mac (D2 as
# amended 2026-10-04), so CI covers only what Linux can prove: every pure-Swift
# package's tests, that the app's own sources parse, and that the Swift sources
# generated from the web's TypeScript (elements, bond fixtures, edge samples,
# starters) are current.

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - 'apps/apple/**'
      - 'tools/apple/**'
      - 'packages/core/**'
      - 'packages/parsers/**'
      - 'apps/mcp-worker/src/**'
      - 'scripts/molecule-pages/**'
      - 'apps/web/public/gallery/**'
      - 'apps/web/public/datasets/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/apple.yml'
  push:
    branches: [main]
    paths:
      - 'apps/apple/**'
      - 'tools/apple/**'
      - 'packages/core/**'
      - 'packages/parsers/**'
      - 'apps/mcp-worker/src/**'
      - 'scripts/molecule-pages/**'
      - 'apps/web/public/gallery/**'
      - 'apps/web/public/datasets/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/apple.yml'

concurrency:
  group: lupi-apple-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  swift-packages:
    name: Swift packages on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      # swift:6.4.0-noble, pinned by digest like the repo's actions.
      image: swift:6.4.0-noble@sha256:31d14d727f4451f25e29bac9c42563a098c39ac66415e8bad970f48038e38aca
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # The app (apps/apple/Lupi) builds only in Xcode. `swiftc -parse` resolves
      # no imports, so this catches syntax errors in its sources, not type errors.
      - name: Parse the app sources
        run: sh tools/apple/parse-app.sh

      # Every package under apps/apple is tested, so a new one is covered
      # without editing this file.
      - name: Test every package
        run: |
          set -eu
          found=0
          for manifest in apps/apple/*/Package.swift; do
            [ -f "$manifest" ] || continue
            dir=$(dirname "$manifest")
            found=$((found + 1))
            echo "::group::swift test ${dir}"
            swift test --package-path "$dir"
            echo "::endgroup::"
          done
          if [ "$found" -eq 0 ]; then
            echo "no Swift packages found under apps/apple" >&2
            exit 1
          fi

      # LupiScale again in release: its byte-exact vectors must hold under
      # optimization too, and its buildCut benchmark (scale-spec §9.8 item 7)
      # fails above 4 ms only in a release build.
      - name: Test LupiScale in release
        run: swift test -c release --package-path apps/apple/LupiScale

  generated-sources:
    name: Generated Swift sources are current
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check generators and their outputs
        run: pnpm apple:check
