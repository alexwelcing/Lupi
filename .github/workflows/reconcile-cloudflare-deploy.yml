name: Reconcile Cloudflare production

on:
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:
    inputs:
      mode:
        description: refresh-checkpoint, reconcile-rollback, or reanchor
        required: true
        type: choice
        options:
          - refresh-checkpoint
          - reconcile-rollback
          - reanchor
      target_sha:
        description: Exact current main controller SHA
        required: true
        type: string
      confirmation:
        description: Mode-specific typed confirmation
        required: true
        type: string
      source_run_id:
        description: Failed release run for reconcile-rollback
        required: false
        type: string
      source_run_attempt:
        description: Failed release attempt for reconcile-rollback
        required: false
        type: string
      intent_sha256:
        description: Exact failed release intent hash
        required: false
        type: string
      prior_version_id:
        description: Exact rollback target
        required: false
        type: string
      incident_sha256:
        description: Exact rollback-required incident hash
        required: false
        type: string
      incident_run_id:
        description: Reconciliation run that emitted the rollback-required incident
        required: false
        type: string
      active_version_id:
        description: Exact active version for reanchor
        required: false
        type: string
      active_build_sha:
        description: Exact active build SHA for reanchor
        required: false
        type: string
      active_fingerprint_sha256:
        description: Exact active public fingerprint for reanchor
        required: false
        type: string
  workflow_run:
    workflows: ['Cloudflare production']
    types: [completed]

concurrency:
  group: lupi-cloudflare-production
  queue: max
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  LUPI_REPOSITORY: alexwelcing/Lupi
  LUPI_WORKER_NAME: lupi-edge
  LUPI_WRANGLER_VERSION: 4.110.0
  LUPI_WRANGLER_INTEGRITY: sha512-xZeXKYi7hxQRF5anL+v77RkufJNpF9f3Eqeyqq2QBsETpLZgh0Agj0jJ6JPtkbgn6ukZdh8OK5egsGPWIditgg==
  LUPI_WRANGLER_LOCK_SHA256: 036615b8e80663617f476cd3a9f7d2f7dc7d858be7b38777b75ca1b9f0f5e9b0

jobs:
  reconcile-authority-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      projection_sha256: ${{ steps.scan.outputs.projection_sha256 }}
    steps:
      - name: Validate controller envelope before checkout
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ inputs.mode }}
          TARGET_SHA: ${{ inputs.target_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
          PRIOR_VERSION_ID: ${{ inputs.prior_version_id }}
          ACTIVE_VERSION_ID: ${{ inputs.active_version_id }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
          INTENT_SHA256: ${{ inputs.intent_sha256 }}
          INCIDENT_SHA256: ${{ inputs.incident_sha256 }}
          INCIDENT_RUN_ID: ${{ inputs.incident_run_id }}
          ACTIVE_BUILD_SHA: ${{ inputs.active_build_sha }}
          ACTIVE_FINGERPRINT_SHA256: ${{ inputs.active_fingerprint_sha256 }}
          WORKFLOW_RUN_JSON: ${{ toJSON(github.event.workflow_run) }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          assert.equal(process.env.GITHUB_RUN_ATTEMPT, '1', 'reruns are forbidden; dispatch a fresh controller');
          const response = await fetch('https://api.github.com/repos/alexwelcing/Lupi/branches/main', {
            headers: {
              accept: 'application/vnd.github+json',
              authorization: `Bearer ${process.env.GH_TOKEN}`,
              'x-github-api-version': '2022-11-28',
            },
          });
          assert.equal(response.status, 200);
          const mainSha = (await response.json())?.commit?.sha;
          assert.match(mainSha ?? '', /^[a-f0-9]{40}$/i);
          if (process.env.GITHUB_EVENT_NAME === 'workflow_dispatch') {
            assert.equal(process.env.GITHUB_ACTOR, 'alexwelcing');
            assert.equal(process.env.GITHUB_REF, 'refs/heads/main');
            assert.equal(process.env.TARGET_SHA, process.env.GITHUB_SHA);
            assert.equal(process.env.TARGET_SHA, mainSha, 'queued controller is stale');
            if (process.env.MODE === 'refresh-checkpoint') {
              assert.equal(process.env.CONFIRMATION, `REFRESH ${process.env.TARGET_SHA}`);
            } else if (process.env.MODE === 'reconcile-rollback') {
              assert.equal(process.env.CONFIRMATION, `ROLLBACK ${process.env.PRIOR_VERSION_ID}`);
              assert.match(process.env.SOURCE_RUN_ID ?? '', /^\d+$/);
              assert.equal(process.env.SOURCE_RUN_ATTEMPT, '1');
              assert.match(process.env.INTENT_SHA256 ?? '', /^[a-f0-9]{64}$/i);
              assert.match(process.env.INCIDENT_SHA256 ?? '', /^[a-f0-9]{64}$/i);
              assert.match(process.env.INCIDENT_RUN_ID ?? '', /^\d+$/);
              assert.match(process.env.PRIOR_VERSION_ID ?? '', /^[A-Za-z0-9][A-Za-z0-9._:-]{5,}$/);
            } else if (process.env.MODE === 'reanchor') {
              assert.equal(process.env.CONFIRMATION, `REANCHOR ${process.env.ACTIVE_VERSION_ID}`);
              assert.match(process.env.ACTIVE_VERSION_ID ?? '', /^[A-Za-z0-9][A-Za-z0-9._:-]{5,}$/);
              assert.match(process.env.ACTIVE_BUILD_SHA ?? '', /^[a-f0-9]{40}$/i);
              assert.match(process.env.ACTIVE_FINGERPRINT_SHA256 ?? '', /^[a-f0-9]{64}$/i);
            } else {
              assert.fail('unsupported manual mode');
            }
          } else {
            assert.equal(process.env.GITHUB_SHA, mainSha, 'automatic controller source is stale');
          }
          if (process.env.GITHUB_EVENT_NAME === 'workflow_run') {
            const source = JSON.parse(process.env.WORKFLOW_RUN_JSON);
            assert.equal(source.repository?.full_name, 'alexwelcing/Lupi');
            assert.equal(source.name, 'Cloudflare production');
            assert.equal(source.head_branch, 'main');
            assert.match(source.head_sha ?? '', /^[a-f0-9]{40}$/i);
            assert.equal(Number(source.run_attempt), 1);
          }
          NODE

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run the closed-world authority scan
        id: scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ inputs.mode }}
          TARGET_SHA: ${{ inputs.target_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          mkdir -p .reconcile/authority/controller
          node tools/cloudflare-release-authority.mjs \
            --root=. \
            --repo=alexwelcing/Lupi \
            --workflow=reconcile-cloudflare-deploy.yml \
            --target-sha=${{ github.sha }} \
            --run-id=${{ github.run_id }} \
            --run-attempt=${{ github.run_attempt }} \
            --live-history=true > .reconcile/authority/authority.json
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { appendFile, copyFile, mkdir, readFile, writeFile } from 'node:fs/promises';
          const report = JSON.parse(await readFile('.reconcile/authority/authority.json', 'utf8'));
          assert.equal(report.ok, true, JSON.stringify(report, null, 2));
          const projection = report.current.projectionSha256;
          await copyFile('tools/cloudflare-release-receipt.mjs', '.reconcile/authority/controller/cloudflare-release-receipt.mjs');
          await mkdir('.reconcile/authority/controller/wrangler-runtime', { recursive: true });
          await copyFile('.github/wrangler-runtime/package.json', '.reconcile/authority/controller/wrangler-runtime/package.json');
          await copyFile('.github/wrangler-runtime/package-lock.json', '.reconcile/authority/controller/wrangler-runtime/package-lock.json');
          const parser = await readFile('.reconcile/authority/controller/cloudflare-release-receipt.mjs');
          const wranglerLock = await readFile('.reconcile/authority/controller/wrangler-runtime/package-lock.json');
          if (process.env.GITHUB_EVENT_NAME === 'workflow_dispatch') {
            const modes = {
              'refresh-checkpoint': 'owner-refresh-checkpoint-v1',
              'reconcile-rollback': 'owner-reconcile-rollback-v1',
              reanchor: 'owner-reanchor-v1',
            };
            const workflow = await readFile('.github/workflows/reconcile-cloudflare-deploy.yml');
            const digest = (value) => createHash('sha256').update(value).digest('hex');
            await writeFile('.reconcile/authority/authorization.json', `${JSON.stringify({
              workflow: 'reconcile-cloudflare-deploy.yml',
              workflowSha256: digest(workflow),
              runId: process.env.GITHUB_RUN_ID,
              runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
              targetSha: process.env.TARGET_SHA,
              ref: process.env.GITHUB_REF,
              actor: process.env.GITHUB_ACTOR,
              event: process.env.GITHUB_EVENT_NAME,
              confirmationMode: modes[process.env.MODE],
              confirmationHash: digest(process.env.CONFIRMATION),
              currentMainProofSha256: digest(JSON.stringify({ repository: 'alexwelcing/Lupi', targetSha: process.env.TARGET_SHA })),
            }, null, 2)}\n`);
          }
          await writeFile('.reconcile/authority/controller-manifest.json', `${JSON.stringify({
            schemaVersion: 'lupi-authority-controller-bundle-v1',
            targetSha: process.env.GITHUB_SHA,
            projectionSha256: projection,
            receiptParserSha256: createHash('sha256').update(parser).digest('hex'),
            wranglerRuntimeLockSha256: createHash('sha256').update(wranglerLock).digest('hex'),
          }, null, 2)}\n`);
          await appendFile(process.env.GITHUB_OUTPUT, `projection_sha256=${projection}\n`);
          NODE

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reconcile-authority-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: .reconcile/authority
          if-no-files-found: error
          retention-days: 90

  reconcile-scan:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode != 'reanchor' }}
    needs: reconcile-authority-scan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: lupi-production-read-v2
    outputs:
      active_version_id: ${{ steps.scan.outputs.active_version_id }}
      active_build_sha: ${{ steps.scan.outputs.active_build_sha }}
      decision: ${{ steps.scan.outputs.decision }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: reconcile-authority-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: authority

      - name: Validate same-run authority artifact
        env:
          EXPECTED_PROJECTION: ${{ needs.reconcile-authority-scan.outputs.projection_sha256 }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          const report = JSON.parse(await readFile('authority/authority.json', 'utf8'));
          assert.equal(report.ok, true);
          assert.equal(report.current.projectionSha256, process.env.EXPECTED_PROJECTION);
          NODE

      - name: Fetch newest retained trusted root
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p scan/root
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { writeFile } from 'node:fs/promises';
          const headers = {
            accept: 'application/vnd.github+json',
            authorization: `Bearer ${process.env.GH_TOKEN}`,
            'x-github-api-version': '2022-11-28',
          };
          const get = async (url) => {
            const response = await fetch(url, { headers });
            assert.equal(response.status, 200, `${url} returned HTTP ${response.status}`);
            return response.json();
          };
          const artifacts = [];
          for (let page = 1; page <= 100; page += 1) {
            const body = await get(`https://api.github.com/repos/alexwelcing/Lupi/actions/artifacts?per_page=100&page=${page}`);
            const items = body.artifacts ?? [];
            artifacts.push(...items);
            if (items.length < 100) break;
            assert.notEqual(page, 100, 'trusted-root artifact pagination exceeded safety bound');
          }
          const candidates = artifacts
            .filter((artifact) => !artifact.expired)
            .filter((artifact) => /^release-(?:checkpoint|outcome)-v1-\d+-1$/.test(artifact.name))
            .sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at));
          const eligible = [];
          for (const artifact of candidates) {
            const run = await get(`https://api.github.com/repos/alexwelcing/Lupi/actions/runs/${artifact.workflow_run?.id}`);
            const match = artifact.name.match(/^release-(checkpoint|outcome)-v1-(\d+)-1$/);
            const expectedWorkflow = match[1] === 'outcome' ? 'Cloudflare production' : 'Reconcile Cloudflare production';
            if (
              String(run.id) === match[2]
              && Number(run.run_attempt) === 1
              && run.name === expectedWorkflow
              && run.conclusion === 'success'
              && run.head_branch === 'main'
              && run.head_repository?.full_name === 'alexwelcing/Lupi'
            ) eligible.push({ artifact, run, kind: match[1] });
          }
          assert.ok(eligible.length > 0, 'no retained trusted root; owner reanchor is required');
          const { artifact, run, kind } = eligible[0];
          const archive = await fetch(artifact.archive_download_url, { headers });
          assert.equal(archive.status, 200);
          const bytes = Buffer.from(await archive.arrayBuffer());
          assert.match(artifact.digest ?? '', /^sha256:[a-f0-9]{64}$/i, 'trusted root artifact digest is missing');
          assert.equal(createHash('sha256').update(bytes).digest('hex'), artifact.digest.slice(7), 'trusted root archive digest mismatch');
          await writeFile('scan/root.zip', bytes);
          await writeFile('scan/root-artifact.json', `${JSON.stringify({
            id: artifact.id,
            name: artifact.name,
            digest: artifact.digest,
            kind,
            createdAt: artifact.created_at,
            expiresAt: artifact.expires_at,
            workflowRunId: run.id,
            workflowName: run.name,
            workflowConclusion: run.conclusion,
            workflowHeadSha: run.head_sha,
          }, null, 2)}\n`);
          NODE
          unzip -q scan/root.zip -d scan/root

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: ${{ github.event_name == 'workflow_run' }}
        continue-on-error: true
        with:
          name: release-intent-v1-${{ github.event.workflow_run.id }}-1
          run-id: ${{ github.event.workflow_run.id }}
          repository: alexwelcing/Lupi
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: scan/source-intent

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: ${{ github.event_name == 'workflow_run' }}
        continue-on-error: true
        with:
          name: release-outcome-v1-${{ github.event.workflow_run.id }}-1
          run-id: ${{ github.event.workflow_run.id }}
          repository: alexwelcing/Lupi
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: scan/source-outcome

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: ${{ github.event_name == 'workflow_run' }}
        continue-on-error: true
        with:
          name: release-resolution-v1-${{ github.event.workflow_run.id }}-1
          run-id: ${{ github.event.workflow_run.id }}
          repository: alexwelcing/Lupi
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: scan/source-resolution

      - name: Bind source release job conclusions before interpreting artifacts
        if: ${{ github.event_name == 'workflow_run' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { writeFile } from 'node:fs/promises';
          const headers = {
            accept: 'application/vnd.github+json',
            authorization: `Bearer ${process.env.GH_TOKEN}`,
            'x-github-api-version': '2022-11-28',
          };
          const get = async (url) => {
            const response = await fetch(url, { headers });
            assert.equal(response.status, 200, `${url} returned HTTP ${response.status}`);
            return response.json();
          };
          const run = await get(`https://api.github.com/repos/alexwelcing/Lupi/actions/runs/${process.env.SOURCE_RUN_ID}`);
          assert.equal(String(run.id), process.env.SOURCE_RUN_ID);
          assert.equal(run.name, 'Cloudflare production');
          assert.equal(run.head_branch, 'main');
          assert.equal(run.head_repository?.full_name, 'alexwelcing/Lupi');
          assert.equal(Number(run.run_attempt), 1);
          const jobs = [];
          for (let page = 1; page <= 20; page += 1) {
            const body = await get(`https://api.github.com/repos/alexwelcing/Lupi/actions/runs/${process.env.SOURCE_RUN_ID}/attempts/1/jobs?per_page=100&page=${page}`);
            const items = body.jobs ?? [];
            jobs.push(...items);
            if (items.length < 100) break;
            assert.notEqual(page, 20, 'source job pagination exceeded safety bound');
          }
          const conclusion = (name) => {
            const matches = jobs.filter((job) => job.name === name);
            assert.equal(matches.length, 1, `expected exactly one ${name} job`);
            return matches[0].conclusion;
          };
          await writeFile('scan/source-run-provenance.json', `${JSON.stringify({
            schemaVersion: 'lupi-source-run-provenance-v1',
            runId: run.id,
            runAttempt: run.run_attempt,
            workflowName: run.name,
            workflowConclusion: run.conclusion,
            headBranch: run.head_branch,
            headSha: run.head_sha,
            releaseRollbackConclusion: conclusion('release-rollback'),
            rollbackResolutionConclusion: conclusion('rollback-resolution'),
          }, null, 2)}\n`);
          NODE

      - name: Read production state and decide without mutating
        id: scan
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.LUPI_CLOUDFLARE_READ_TOKEN_V2 }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          SOURCE_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT_NAME: ${{ github.event_name }}
          MODE: ${{ inputs.mode }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { appendFile, copyFile, readFile, readdir, writeFile } from 'node:fs/promises';
          import {
            canonicalSha256,
            decideReconciliation,
            validateCheckpoint,
            validateReleaseIntent,
            validateResolution,
            validateRootOutcome,
          } from './authority/controller/cloudflare-release-receipt.mjs';
          const base = `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/workers/scripts/lupi-edge`;
          const response = await fetch(`${base}/deployments`, {
            headers: { authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}` },
          });
          assert.equal(response.status, 200);
          const body = await response.json();
          assert.equal(body.success, true);
          const versions = body.result?.deployments?.[0]?.versions ?? [];
          assert.equal(versions.length, 1, 'split/third state requires owner investigation');
          assert.equal(Number(versions[0].percentage), 100);
          const activeVersionId = versions[0].version_id ?? versions[0].id;
          assert.match(activeVersionId ?? '', /^[A-Za-z0-9][A-Za-z0-9._:-]{5,}$/);
          const healthResponse = await fetch('https://lupi.live/health', { redirect: 'error' });
          assert.equal(healthResponse.status, 200);
          const health = await healthResponse.json();
          const activeBuildSha = health.release?.tag ?? health.release?.id;
          assert.match(activeBuildSha ?? '', /^[a-f0-9]{40}$/i, 'active release metadata is missing; reanchor required');
          const rootArtifact = JSON.parse(await readFile('scan/root-artifact.json', 'utf8'));
          const rootFiles = await readdir('scan/root', { recursive: true });
          const expectedRootName = rootArtifact.kind === 'checkpoint' ? 'release-checkpoint.json' : 'release-outcome.json';
          const rootPath = rootFiles.find((name) => name.endsWith(expectedRootName));
          assert.ok(rootPath, `trusted root archive is missing ${expectedRootName}`);
          const rootValue = JSON.parse(await readFile(`scan/root/${rootPath}`, 'utf8'));
          if (rootArtifact.kind === 'checkpoint') validateCheckpoint(rootValue);
          else validateRootOutcome(rootValue);
          const retainedBundle = rootValue.schemaVersion === 'lupi-release-checkpoint-v1'
            ? rootValue.activeRollbackBundle
            : rootValue;
          let selectedRoot = retainedBundle;
          let decision = 'verified-noop';
          let intent = null;
          let intentSha256 = null;
          if (process.env.EVENT_NAME === 'workflow_run') {
            const intentFiles = await readdir('scan/source-intent', { recursive: true }).catch(() => []);
            const intentPath = intentFiles.find((name) => name.endsWith('release-intent.json'));
            if (intentPath) {
              const intentBytes = await readFile(`scan/source-intent/${intentPath}`);
              intentSha256 = createHash('sha256').update(intentBytes).digest('hex');
              intent = JSON.parse(intentBytes);
              validateReleaseIntent(intent);
              assert.equal(intent.runId, process.env.SOURCE_RUN_ID);
              assert.equal(Number(intent.runAttempt), Number(process.env.SOURCE_RUN_ATTEMPT));
              assert.equal(intent.targetSha, process.env.SOURCE_HEAD_SHA);
              const outcomeFiles = await readdir('scan/source-outcome', { recursive: true }).catch(() => []);
              const outcomePath = outcomeFiles.find((name) => name.endsWith('release-outcome.json'));
              let outcome = null;
              if (outcomePath) {
                outcome = JSON.parse(await readFile(`scan/source-outcome/${outcomePath}`, 'utf8'));
                validateRootOutcome(outcome);
              }
              const resolutionFiles = await readdir('scan/source-resolution', { recursive: true }).catch(() => []);
              const resolutionPath = resolutionFiles.find((name) => name.endsWith('release-resolution.json'));
              let resolution = null;
              if (resolutionPath) {
                resolution = JSON.parse(await readFile(`scan/source-resolution/${resolutionPath}`, 'utf8'));
                validateResolution(resolution);
                assert.equal(resolution.resolutionMode, 'bounded-release-rollback-v1');
                assert.equal(String(resolution.sourceRunId), String(intent.runId));
                assert.equal(Number(resolution.sourceRunAttempt), Number(intent.runAttempt));
                assert.equal(resolution.targetSha, intent.targetSha);
                assert.equal(resolution.intentSha256, intentSha256);
                assert.equal(resolution.priorContractSha256, intent.priorContractSha256);
                assert.equal(String(resolution.authorization.runId), String(intent.runId));
                assert.equal(resolution.authorization.targetSha, intent.targetSha);
              }
              const provenance = JSON.parse(await readFile('scan/source-run-provenance.json', 'utf8'));
              assert.equal(String(provenance.runId), String(intent.runId));
              assert.equal(Number(provenance.runAttempt), Number(intent.runAttempt));
              if (activeVersionId === intent.priorVersionId) {
                if (provenance.releaseRollbackConclusion === 'skipped') {
                  assert.equal(resolution, null, 'a skipped rollback cannot have a bounded-rollback resolution');
                } else {
                  assert.equal(provenance.releaseRollbackConclusion, 'success', 'rollback may have mutated before failing; owner investigation is required');
                  assert.equal(provenance.rollbackResolutionConclusion, 'success', 'successful rollback is missing a successful resolution job');
                  assert.ok(resolution, 'successful rollback is missing its durable resolution');
                  assert.equal(retainedBundle.activeVersionId, intent.priorVersionId, 'resolved rollback no longer matches the retained trusted root');
                  assert.equal(canonicalSha256(retainedBundle.baseline), intent.priorBaselineSha256);
                  assert.equal(canonicalSha256(retainedBundle.rollbackContract), intent.priorContractSha256);
                }
              } else {
                assert.equal(resolution, null, 'bounded-rollback resolution exists while the prior version is not active');
              }
              if (process.env.SOURCE_CONCLUSION === 'success') assert.ok(outcome, 'successful release is missing its trusted outcome');
              const result = decideReconciliation({ active: { versions }, intent, outcome, resolution });
              if (result.decision === 'rollback-required') decision = 'rollback-required';
              else if (result.decision === 'trusted-candidate-active') {
                decision = 'verified-noop';
                selectedRoot = outcome;
              } else if (result.decision === 'prior-already-active-noop' || result.decision === 'already-resolved') decision = 'verified-noop';
              else throw new Error(`unsupported reconciliation result ${result.decision}`);
              if (outcome) {
                assert.equal(outcome.intentSha256, intentSha256);
              }
            } else {
              assert.notEqual(process.env.SOURCE_CONCLUSION, 'success', 'successful release is missing its intent');
              assert.equal(activeVersionId, retainedBundle.activeVersionId, 'failed pre-intent release changed active state');
            }
          } else if (process.env.MODE === 'reconcile-rollback') {
            decision = 'owner-rollback-pending';
          } else {
            assert.equal(activeVersionId, retainedBundle.activeVersionId, 'active state differs from the retained trusted root');
          }
          await writeFile('scan/selected-root.json', `${JSON.stringify(selectedRoot, null, 2)}\n`);
          const record = {
            schemaVersion: 'lupi-reconciliation-scan-v1',
            observedAt: new Date().toISOString(),
            activeVersionId,
            activeBuildSha,
            decision,
            sourceConclusion: process.env.SOURCE_CONCLUSION || null,
            trustedRootArtifact: rootArtifact,
            selectedRootSha256: canonicalSha256(selectedRoot),
          };
          await writeFile('scan/reconciliation-scan.json', `${JSON.stringify(record, null, 2)}\n`);
          if (decision === 'rollback-required') {
            assert.ok(intent, 'rollback incident requires a validated release intent');
            await writeFile('scan/rollback-required.json', `${JSON.stringify({
              schemaVersion: 'lupi-rollback-required-v1',
              repository: 'alexwelcing/Lupi',
              targetSha: intent.targetSha,
              sourceRunId: process.env.SOURCE_RUN_ID,
              sourceRunAttempt: Number(process.env.SOURCE_RUN_ATTEMPT),
              reconciliationRunId: process.env.GITHUB_RUN_ID,
              reconciliationRunAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
              intentSha256,
              priorVersionId: intent.priorVersionId,
              candidateVersionId: intent.candidateVersionId,
              observedActiveVersionId: activeVersionId,
              createdAt: new Date().toISOString(),
            }, null, 2)}\n`);
          }
          await appendFile(process.env.GITHUB_OUTPUT, `active_version_id=${activeVersionId}\nactive_build_sha=${activeBuildSha}\ndecision=${decision}\n`);
          NODE

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reconciliation-scan-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: scan
          if-no-files-found: error
          retention-days: 90

  reanchor-control:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'reanchor' }}
    needs: reconcile-authority-scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: lupi-production-reanchor-v2
    outputs:
      active_build_sha: ${{ steps.control.outputs.active_build_sha }}
      active_version_id: ${{ steps.control.outputs.active_version_id }}
    steps:
      - name: Prove owner-supplied active identity without mutating
        id: control
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.LUPI_CLOUDFLARE_READ_TOKEN_V2 }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ACTIVE_VERSION_ID: ${{ inputs.active_version_id }}
          ACTIVE_BUILD_SHA: ${{ inputs.active_build_sha }}
          ACTIVE_FINGERPRINT_SHA256: ${{ inputs.active_fingerprint_sha256 }}
        run: |
          mkdir -p reanchor-control
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { appendFile, writeFile } from 'node:fs/promises';
          assert.match(process.env.ACTIVE_VERSION_ID ?? '', /^[A-Za-z0-9][A-Za-z0-9._:-]{5,}$/);
          assert.match(process.env.ACTIVE_BUILD_SHA ?? '', /^[a-f0-9]{40}$/i);
          assert.match(process.env.ACTIVE_FINGERPRINT_SHA256 ?? '', /^[a-f0-9]{64}$/i);
          const url = `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/workers/scripts/lupi-edge/deployments`;
          const response = await fetch(url, { headers: { authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}` } });
          assert.equal(response.status, 200);
          const body = await response.json();
          assert.equal(body.success, true);
          const versions = body.result?.deployments?.[0]?.versions ?? [];
          assert.equal(versions.length, 1);
          assert.equal(versions[0].version_id ?? versions[0].id, process.env.ACTIVE_VERSION_ID);
          assert.equal(Number(versions[0].percentage), 100);
          const health = await fetch('https://lupi.live/health', { redirect: 'error' }).then((value) => value.json());
          assert.equal(health.release?.tag ?? health.release?.id, process.env.ACTIVE_BUILD_SHA);
          const ids = [];
          const perPage = 100;
          for (let page = 1; page <= 100; page += 1) {
            const versionsResponse = await fetch(`${url.slice(0, -'/deployments'.length)}/versions?per_page=${perPage}&page=${page}`, {
              headers: { authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}` },
            });
            assert.equal(versionsResponse.status, 200);
            const versionsBody = await versionsResponse.json();
            assert.equal(versionsBody.success, true);
            const items = versionsBody.result?.items;
            assert.ok(Array.isArray(items), 'versions response must contain result.items');
            ids.push(...items.map((item) => item.id));
            if (items.length < perPage) break;
            assert.notEqual(page, 100, 'reanchor version pagination exceeded safety bound');
          }
          assert.equal(new Set(ids).size, ids.length, 'reanchor version inventory contains duplicate IDs');
          assert.ok(ids.includes(process.env.ACTIVE_VERSION_ID), 'active version is absent from the complete inventory');
          const inventory = {
            schemaVersion: 'lupi-version-inventory-v1',
            fetchedAt: new Date().toISOString(),
            complete: true,
            versionIds: ids,
          };
          const control = {
            schemaVersion: 'lupi-reanchor-control-v1',
            observedAt: new Date().toISOString(),
            activeVersionId: process.env.ACTIVE_VERSION_ID,
            activeBuildSha: process.env.ACTIVE_BUILD_SHA,
            expectedPublicFingerprintSha256: process.env.ACTIVE_FINGERPRINT_SHA256,
          };
          await writeFile('reanchor-control/version-inventory.json', `${JSON.stringify(inventory, null, 2)}\n`);
          await writeFile('reanchor-control/control-plane.json', `${JSON.stringify(control, null, 2)}\n`);
          await appendFile(process.env.GITHUB_OUTPUT, `active_build_sha=${process.env.ACTIVE_BUILD_SHA}\nactive_version_id=${process.env.ACTIVE_VERSION_ID}\n`);
          NODE

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reanchor-control-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: reanchor-control
          if-no-files-found: error
          retention-days: 90

  reanchor-reconstruct:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'reanchor' }}
    needs: [reconcile-authority-scan, reanchor-control]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.reanchor-control.outputs.active_build_sha }}
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: reconcile-authority-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: authority

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: reanchor-control-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: control

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Reconstruct exact-source public proof
        env:
          UI_TEST_URL: https://lupi.live
          UI_TEST_EXPECT_HEALTH: 'true'
          ACTIVE_VERSION_ID: ${{ needs.reanchor-control.outputs.active_version_id }}
          ACTIVE_BUILD_SHA: ${{ needs.reanchor-control.outputs.active_build_sha }}
          ACTIVE_FINGERPRINT_SHA256: ${{ inputs.active_fingerprint_sha256 }}
          VITE_LUPI_BUILD_SHA: ${{ needs.reanchor-control.outputs.active_build_sha }}
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          mkdir -p reanchor
          selective_routing_args=()
          if pnpm verify:cloudflare-live --help | grep -q -- '--expect-selective-routing'; then
            selective_routing_args+=(--expect-selective-routing=true)
          fi
          pnpm verify:cloudflare-live \
            --url=https://lupi.live \
            --label=reanchor-public \
            --require-custom-domain \
            --capture-prior-baseline \
            --expect-build-sha="$ACTIVE_BUILD_SHA" \
            --expect-worker-version-id="$ACTIVE_VERSION_ID" \
            --expect-web-assets=true \
            --expect-r2=true \
            --expect-d1=false \
            --expect-queue=false \
            --expect-renderer-endpoint=false \
            "${selective_routing_args[@]}" \
            --expect-firebase-project=true \
            --expect-large-asset-proxy=true \
            --expect-auth-required=false \
            --expect-render-execution=false \
            --json > reanchor/live-api.json
          pnpm exec playwright install --with-deps chromium
          pnpm test:ui
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { readFile, writeFile } from 'node:fs/promises';
          import { canonicalSha256, validateRootOutcome } from './authority/controller/cloudflare-release-receipt.mjs';
          const digest = (value) => createHash('sha256').update(value).digest('hex');
          const sha = async (path) => digest(await readFile(path));
          const reportBytes = await readFile('reanchor/live-api.json');
          const report = JSON.parse(reportBytes);
          assert.equal(report.ok, true);
          assert.ok(report.baseline?.projection, 'reanchor verifier did not emit a normal baseline');
          assert.equal(canonicalSha256(report.baseline.projection), process.env.ACTIVE_FINGERPRINT_SHA256);
          const controlBytes = await readFile('control/control-plane.json');
          const control = JSON.parse(controlBytes);
          assert.equal(control.activeVersionId, process.env.ACTIVE_VERSION_ID);
          assert.equal(control.activeBuildSha, process.env.ACTIVE_BUILD_SHA);
          assert.equal(control.expectedPublicFingerprintSha256, process.env.ACTIVE_FINGERPRINT_SHA256);
          const inventoryBytes = await readFile('control/version-inventory.json');
          const inventory = JSON.parse(inventoryBytes);
          assert.equal(inventory.complete, true);
          assert.ok(inventory.versionIds.includes(process.env.ACTIVE_VERSION_ID));
          const sourceManifest = {
            schemaVersion: 'lupi-source-manifest-v1',
            targetSha: process.env.ACTIVE_BUILD_SHA,
            files: [
              { path: 'pnpm-lock.yaml', sha256: await sha('pnpm-lock.yaml') },
              { path: 'playwright.config.mjs', sha256: await sha('playwright.config.mjs') },
              { path: 'tests/ui/lupi.spec.ts', sha256: await sha('tests/ui/lupi.spec.ts') },
            ],
          };
          const sourceManifestBytes = Buffer.from(`${JSON.stringify(sourceManifest, null, 2)}\n`);
          await writeFile('reanchor/source-manifest.json', sourceManifestBytes);
          const uiProof = {
            schemaVersion: 'lupi-ui-proof-v1',
            targetSha: process.env.ACTIVE_BUILD_SHA,
            suite: 'full-ui-v1',
            result: 'pass',
            testFileSha256: await sha('tests/ui/lupi.spec.ts'),
            configFileSha256: await sha('playwright.config.mjs'),
          };
          const uiProofBytes = Buffer.from(`${JSON.stringify(uiProof, null, 2)}\n`);
          await writeFile('reanchor/ui-proof.json', uiProofBytes);
          const contract = {
            schemaVersion: 'lupi-rollback-contract-v1',
            repository: 'alexwelcing/Lupi',
            targetSha: process.env.ACTIVE_BUILD_SHA,
            workerVersionId: process.env.ACTIVE_VERSION_ID,
            nodeVersion: process.version,
            pnpmVersion: '9',
            lockSha256: await sha('pnpm-lock.yaml'),
            sourceManifestSha256: digest(sourceManifestBytes),
            configFiles: [{ path: 'playwright.config.mjs', sha256: await sha('playwright.config.mjs') }],
            testFiles: [{ path: 'tests/ui/lupi.spec.ts', sha256: await sha('tests/ui/lupi.spec.ts') }],
            commandMode: 'full-ui-v1',
            environmentNames: ['UI_TEST_URL', 'UI_TEST_EXPECT_HEALTH'],
            expectedTestNames: ['full-ui-v1'],
            preMutationReport: { result: 'pass', sha256: digest(reportBytes) },
          };
          const authorization = JSON.parse(await readFile('authority/authorization.json', 'utf8'));
          const projected = {
            schemaVersion: 'lupi-release-reanchor-outcome-v1',
            repository: 'alexwelcing/Lupi',
            targetSha: process.env.ACTIVE_BUILD_SHA,
            activeVersionId: process.env.ACTIVE_VERSION_ID,
            completedAt: new Date().toISOString(),
            controlPlaneSha256: digest(controlBytes),
            apiReportSha256: digest(reportBytes),
            rollbackUiReportSha256: digest(uiProofBytes),
            baseline: report.baseline,
            rollbackContract: contract,
            sourceManifest,
            authorization,
            versionInventorySha256: digest(inventoryBytes),
          };
          const outcome = { ...projected, bundleSha256: canonicalSha256(projected) };
          validateRootOutcome(outcome);
          await writeFile('reanchor/release-reanchor-outcome.json', `${JSON.stringify(outcome, null, 2)}\n`);
          NODE

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reanchor-reconstruction-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: reanchor
          if-no-files-found: error
          retention-days: 90

  reconcile-rollback:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'reconcile-rollback' }}
    needs: [reconcile-authority-scan, reconcile-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: lupi-production-write-v2
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: reconcile-authority-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: authority

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: reconciliation-scan-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: current-scan

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: reconciliation-scan-v1-${{ inputs.incident_run_id }}-1
          run-id: ${{ inputs.incident_run_id }}
          repository: alexwelcing/Lupi
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: reconciliation

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-intent-v1-${{ inputs.source_run_id }}-1
          run-id: ${{ inputs.source_run_id }}
          repository: alexwelcing/Lupi
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: failed-release

      - name: Validate owner-linked rollback incident
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
          INTENT_SHA256: ${{ inputs.intent_sha256 }}
          INCIDENT_SHA256: ${{ inputs.incident_sha256 }}
          INCIDENT_RUN_ID: ${{ inputs.incident_run_id }}
          PRIOR_VERSION_ID: ${{ inputs.prior_version_id }}
          EXPECTED_ACTIVE_VERSION_ID: ${{ needs.reconcile-scan.outputs.active_version_id }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { readFile } from 'node:fs/promises';
          import { bindRollbackIncident, canonicalSha256, validateReleaseIntent, validateRootOutcome } from './authority/controller/cloudflare-release-receipt.mjs';
          assert.match(process.env.SOURCE_RUN_ID ?? '', /^\d+$/);
          assert.equal(process.env.SOURCE_RUN_ATTEMPT, '1');
          assert.match(process.env.INTENT_SHA256 ?? '', /^[a-f0-9]{64}$/i);
          assert.match(process.env.INCIDENT_SHA256 ?? '', /^[a-f0-9]{64}$/i);
          assert.match(process.env.INCIDENT_RUN_ID ?? '', /^\d+$/);
          assert.match(process.env.PRIOR_VERSION_ID ?? '', /^[A-Za-z0-9][A-Za-z0-9._:-]{5,}$/);
          const bytes = await readFile('reconciliation/rollback-required.json');
          assert.equal(createHash('sha256').update(bytes).digest('hex'), process.env.INCIDENT_SHA256);
          const intentBytes = await readFile('failed-release/release-intent.json');
          assert.equal(createHash('sha256').update(intentBytes).digest('hex'), process.env.INTENT_SHA256);
          const intent = JSON.parse(intentBytes);
          validateReleaseIntent(intent);
          assert.equal(intent.runId, process.env.SOURCE_RUN_ID);
          assert.equal(Number(intent.runAttempt), Number(process.env.SOURCE_RUN_ATTEMPT));
          assert.equal(intent.priorVersionId, process.env.PRIOR_VERSION_ID);
          const incident = JSON.parse(bytes);
          bindRollbackIncident(incident, {
            sourceRunId: process.env.SOURCE_RUN_ID,
            sourceRunAttempt: process.env.SOURCE_RUN_ATTEMPT,
            reconciliationRunId: process.env.INCIDENT_RUN_ID,
            intentSha256: process.env.INTENT_SHA256,
            priorVersionId: process.env.PRIOR_VERSION_ID,
            observedActiveVersionId: process.env.EXPECTED_ACTIVE_VERSION_ID,
          });
          assert.equal(incident.targetSha, intent.targetSha);
          assert.equal(incident.candidateVersionId, intent.candidateVersionId);
          const selectedRoot = JSON.parse(await readFile('current-scan/selected-root.json', 'utf8'));
          validateRootOutcome(selectedRoot);
          const currentScan = JSON.parse(await readFile('current-scan/reconciliation-scan.json', 'utf8'));
          assert.equal(currentScan.selectedRootSha256, canonicalSha256(selectedRoot));
          assert.equal(selectedRoot.activeVersionId, intent.priorVersionId, 'current trusted root no longer names the authorized rollback target');
          assert.equal(canonicalSha256(selectedRoot.baseline), intent.priorBaselineSha256, 'current trusted baseline differs from the failed release intent');
          assert.equal(canonicalSha256(selectedRoot.rollbackContract), intent.priorContractSha256, 'current trusted rollback contract differs from the failed release intent');
          const headers = {
            accept: 'application/vnd.github+json',
            authorization: `Bearer ${process.env.GH_TOKEN}`,
            'x-github-api-version': '2022-11-28',
          };
          const getRun = async (id) => {
            const response = await fetch(`https://api.github.com/repos/alexwelcing/Lupi/actions/runs/${id}`, { headers });
            assert.equal(response.status, 200, `run ${id} returned HTTP ${response.status}`);
            return response.json();
          };
          const sourceRun = await getRun(process.env.SOURCE_RUN_ID);
          assert.equal(String(sourceRun.id), process.env.SOURCE_RUN_ID);
          assert.equal(sourceRun.name, 'Cloudflare production');
          assert.equal(sourceRun.head_branch, 'main');
          assert.equal(sourceRun.head_repository?.full_name, 'alexwelcing/Lupi');
          assert.equal(Number(sourceRun.run_attempt), 1);
          assert.equal(sourceRun.event, 'workflow_dispatch');
          assert.ok(
            ['failure', 'cancelled', 'timed_out', 'action_required', 'stale', 'startup_failure'].includes(sourceRun.conclusion),
            'rollback incident source must be a completed non-successful release',
          );
          assert.equal(sourceRun.head_sha, intent.targetSha);
          const incidentRun = await getRun(process.env.INCIDENT_RUN_ID);
          assert.equal(String(incidentRun.id), process.env.INCIDENT_RUN_ID);
          assert.equal(incidentRun.name, 'Reconcile Cloudflare production');
          assert.equal(incidentRun.head_branch, 'main');
          assert.equal(incidentRun.head_repository?.full_name, 'alexwelcing/Lupi');
          assert.equal(Number(incidentRun.run_attempt), 1);
          assert.equal(incidentRun.event, 'workflow_run');
          assert.equal(incidentRun.conclusion, 'success');
          NODE

      - name: Bootstrap integrity-pinned Wrangler
        run: |
          expected='036615b8e80663617f476cd3a9f7d2f7dc7d858be7b38777b75ca1b9f0f5e9b0'
          root="$RUNNER_TEMP/lupi-wrangler"
          mkdir -p "$root/runtime"
          cp authority/controller/wrangler-runtime/package.json "$root/runtime/package.json"
          cp authority/controller/wrangler-runtime/package-lock.json "$root/runtime/package-lock.json"
          echo "$expected  $root/runtime/package-lock.json" | sha256sum --check --strict
          npm ci --ignore-scripts --omit=dev --prefix "$root/runtime"
          test "$(node -p "require('$root/runtime/node_modules/wrangler/package.json').version")" = 4.110.0

      - name: Reassign traffic to the trusted prior version after final state and inventory reads
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.LUPI_CLOUDFLARE_WRITE_TOKEN_V2 }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          EXPECTED_ACTIVE_VERSION_ID: ${{ needs.reconcile-scan.outputs.active_version_id }}
          PRIOR_VERSION_ID: ${{ inputs.prior_version_id }}
        run: |
          current="$("$RUNNER_TEMP/lupi-wrangler/runtime/node_modules/.bin/wrangler" deployments status --name lupi-edge --json)"
          node --input-type=module - "$current" <<'NODE'
          import assert from 'node:assert/strict';
          import { writeFile } from 'node:fs/promises';
          const value = JSON.parse(process.argv[2]);
          const deployment = Array.isArray(value) ? value[0] : value;
          const versions = deployment.versions ?? [];
          assert.equal(versions.length, 1, 'split/third state forbids rollback');
          assert.equal(versions[0].version_id ?? versions[0].id, process.env.EXPECTED_ACTIVE_VERSION_ID);
          assert.equal(Number(versions[0].percentage), 100);
          const base = `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/workers/scripts/lupi-edge`;
          const ids = [];
          const perPage = 100;
          for (let page = 1; page <= 100; page += 1) {
            const response = await fetch(`${base}/versions?per_page=${perPage}&page=${page}`, {
              headers: { authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}` },
            });
            assert.equal(response.status, 200, `pre-reconciliation inventory page ${page} failed`);
            const body = await response.json();
            assert.equal(body.success, true);
            const items = body.result?.items;
            assert.ok(Array.isArray(items), 'versions response must contain result.items');
            for (const version of items) ids.push(version.id);
            if (items.length < perPage) break;
            assert.notEqual(page, 100, 'pre-reconciliation pagination exceeded safety bound');
          }
          assert.equal(new Set(ids).size, ids.length, 'pre-reconciliation inventory contains duplicate version IDs');
          assert.ok(ids.includes(process.env.EXPECTED_ACTIVE_VERSION_ID), 'active candidate is absent from version inventory');
          const priorRank = ids.indexOf(process.env.PRIOR_VERSION_ID) + 1;
          assert.ok(priorRank >= 1 && priorRank <= 100, `prior version rank ${priorRank} is not rollback-eligible`);
          await writeFile('pre-reconciliation-inventory.json', `${JSON.stringify({
            schemaVersion: 'lupi-version-inventory-v1',
            fetchedAt: new Date().toISOString(),
            complete: true,
            versionIds: ids,
          }, null, 2)}\n`);
          NODE
          "$RUNNER_TEMP/lupi-wrangler/runtime/node_modules/.bin/wrangler" versions deploy \
            "${PRIOR_VERSION_ID}@100%" \
            --name lupi-edge \
            --message "Owner reconciliation traffic rollback ${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}" \
            -y
          restored="$("$RUNNER_TEMP/lupi-wrangler/runtime/node_modules/.bin/wrangler" deployments status --name lupi-edge --json)"
          node --input-type=module - "$current" "$restored" <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile, writeFile } from 'node:fs/promises';
          const afterValue = JSON.parse(process.argv[3]);
          const after = Array.isArray(afterValue) ? afterValue[0] : afterValue;
          const versions = after.versions ?? [];
          assert.equal(versions.length, 1);
          assert.equal(versions[0].version_id ?? versions[0].id, process.env.PRIOR_VERSION_ID);
          assert.equal(Number(versions[0].percentage), 100);
          const currentScan = JSON.parse(await readFile('current-scan/reconciliation-scan.json', 'utf8'));
          const inventory = JSON.parse(await readFile('pre-reconciliation-inventory.json', 'utf8'));
          await writeFile('rollback-command.json', `${JSON.stringify({
            schemaVersion: 'lupi-reconcile-rollback-command-v1',
            controllerRunId: process.env.GITHUB_RUN_ID,
            controllerRunAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
            beforeDeployment: JSON.parse(process.argv[2]),
            afterDeployment: after,
            rollbackVersionId: process.env.PRIOR_VERSION_ID,
            trustedRootSha256: currentScan.selectedRootSha256,
            preRollbackInventory: inventory,
            result: 'traffic-reassigned',
          }, null, 2)}\n`);
          NODE

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reconciliation-command-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: rollback-command.json
          if-no-files-found: error
          retention-days: 90

  reconcile-verify:
    if: ${{ always() && needs.reconcile-scan.result == 'success' && (needs.reconcile-rollback.result == 'success' || needs.reconcile-rollback.result == 'skipped') }}
    needs: [reconcile-authority-scan, reconcile-scan, reconcile-rollback]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: lupi-production-read-v2
    outputs:
      verified_build_sha: ${{ steps.verify.outputs.verified_build_sha }}
      verified_active_version_id: ${{ steps.verify.outputs.verified_active_version_id }}
    steps:
      - name: Re-read control plane and public release identity
        id: verify
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.LUPI_CLOUDFLARE_READ_TOKEN_V2 }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PREVIOUS_ACTIVE_VERSION_ID: ${{ needs.reconcile-scan.outputs.active_version_id }}
          ROLLBACK_RESULT: ${{ needs.reconcile-rollback.result }}
          PRIOR_VERSION_ID: ${{ inputs.prior_version_id }}
        run: |
          mkdir -p verify
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { appendFile, writeFile } from 'node:fs/promises';
          const url = `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/workers/scripts/lupi-edge/deployments`;
          const response = await fetch(url, { headers: { authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}` } });
          assert.equal(response.status, 200);
          const body = await response.json();
          assert.equal(body.success, true);
          const versions = body.result?.deployments?.[0]?.versions ?? [];
          assert.equal(versions.length, 1);
          const expected = process.env.ROLLBACK_RESULT === 'success'
            ? process.env.PRIOR_VERSION_ID
            : process.env.PREVIOUS_ACTIVE_VERSION_ID;
          assert.equal(versions[0].version_id ?? versions[0].id, expected);
          assert.equal(Number(versions[0].percentage), 100);
          const healthResponse = await fetch('https://lupi.live/health', { redirect: 'error' });
          assert.equal(healthResponse.status, 200);
          const health = await healthResponse.json();
          const buildSha = health.release?.tag ?? health.release?.id;
          assert.match(buildSha ?? '', /^[a-f0-9]{40}$/i);
          const report = {
            schemaVersion: 'lupi-reconciliation-verification-v1',
            verifiedAt: new Date().toISOString(),
            activeVersionId: expected,
            buildSha,
            rollbackResult: process.env.ROLLBACK_RESULT,
          };
          await writeFile('verify/reconciliation-verification.json', `${JSON.stringify(report, null, 2)}\n`);
          await appendFile(process.env.GITHUB_OUTPUT, `verified_build_sha=${buildSha}\nverified_active_version_id=${expected}\n`);
          NODE

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reconciliation-verification-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: verify
          if-no-files-found: error
          retention-days: 90

  reconcile-ui-verify:
    if: ${{ always() && needs.reconcile-verify.result == 'success' }}
    needs: [reconcile-authority-scan, reconcile-verify]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.reconcile-verify.outputs.verified_build_sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Run exact active source UI suite
        env:
          UI_TEST_URL: https://lupi.live
          UI_TEST_EXPECT_HEALTH: 'true'
          VERIFIED_BUILD_SHA: ${{ needs.reconcile-verify.outputs.verified_build_sha }}
          VERIFIED_ACTIVE_VERSION_ID: ${{ needs.reconcile-verify.outputs.verified_active_version_id }}
        run: |
          pnpm install --frozen-lockfile
          mkdir -p ui-proof
          selective_routing_args=()
          if pnpm verify:cloudflare-live --help | grep -q -- '--expect-selective-routing'; then
            selective_routing_args+=(--expect-selective-routing=true)
          fi
          pnpm verify:cloudflare-live \
            --url=https://lupi.live \
            --label=reconciliation-public \
            --require-custom-domain \
            --expect-build-sha="$VERIFIED_BUILD_SHA" \
            --expect-worker-version-id="$VERIFIED_ACTIVE_VERSION_ID" \
            --expect-web-assets=true \
            --expect-r2=true \
            --expect-d1=false \
            --expect-queue=false \
            --expect-renderer-endpoint=false \
            "${selective_routing_args[@]}" \
            --expect-firebase-project=true \
            --expect-large-asset-proxy=true \
            --expect-auth-required=false \
            --expect-render-execution=false \
            --json > ui-proof/live-api.json
          pnpm exec playwright install --with-deps chromium
          pnpm test:ui
          git rev-parse HEAD > ui-proof/source-sha.txt
          sha256sum pnpm-lock.yaml playwright.config.mjs tests/ui/lupi.spec.ts > ui-proof/source-manifest.sha256
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFile, writeFile } from 'node:fs/promises';
          const digest = (value) => createHash('sha256').update(value).digest('hex');
          await writeFile('ui-proof/ui-proof.json', `${JSON.stringify({
            schemaVersion: 'lupi-ui-proof-v1',
            targetSha: process.env.VERIFIED_BUILD_SHA,
            activeVersionId: process.env.VERIFIED_ACTIVE_VERSION_ID,
            suite: 'full-ui-v1',
            result: 'pass',
            liveApiSha256: digest(await readFile('ui-proof/live-api.json')),
            sourceManifestSha256: digest(await readFile('ui-proof/source-manifest.sha256')),
          }, null, 2)}\n`);
          NODE

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reconciliation-ui-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: ui-proof
          if-no-files-found: error
          retention-days: 90

  checkpoint:
    if: >-
      ${{ always() && needs.reconcile-authority-scan.result == 'success' &&
          ((github.event_name == 'workflow_dispatch' && inputs.mode == 'reanchor' && needs.reanchor-reconstruct.result == 'success') ||
           ((github.event_name != 'workflow_dispatch' || inputs.mode != 'reanchor') &&
            needs.reconcile-scan.result == 'success' && needs.reconcile-verify.result == 'success' &&
            needs.reconcile-ui-verify.result == 'success' &&
            (needs.reconcile-scan.outputs.decision == 'verified-noop' ||
             (inputs.mode == 'reconcile-rollback' && needs.reconcile-scan.outputs.decision == 'owner-rollback-pending' && needs.reconcile-rollback.result == 'success')))) }}
    needs: [reconcile-authority-scan, reconcile-scan, reconcile-rollback, reconcile-verify, reconcile-ui-verify, reanchor-reconstruct]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: reconcile-authority-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: authority

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: ${{ needs.reconcile-scan.result == 'success' }}
        with:
          name: reconciliation-scan-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: scan

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: ${{ needs.reconcile-verify.result == 'success' }}
        with:
          name: reconciliation-verification-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: verify

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: ${{ needs.reconcile-ui-verify.result == 'success' }}
        with:
          name: reconciliation-ui-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: ui

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: ${{ needs.reanchor-reconstruct.result == 'success' }}
        with:
          name: reanchor-reconstruction-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: reanchor

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: ${{ inputs.mode == 'reconcile-rollback' }}
        with:
          name: reconciliation-command-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: rollback-command

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: ${{ inputs.mode == 'reconcile-rollback' }}
        with:
          name: reconciliation-scan-v1-${{ inputs.incident_run_id }}-1
          run-id: ${{ inputs.incident_run_id }}
          repository: alexwelcing/Lupi
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: rollback-incident

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: ${{ inputs.mode == 'reconcile-rollback' }}
        with:
          name: release-intent-v1-${{ inputs.source_run_id }}-1
          run-id: ${{ inputs.source_run_id }}
          repository: alexwelcing/Lupi
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: rollback-intent

      - name: Carry complete active rollback bundle into fresh checkpoint
        run: |
          mkdir -p checkpoint resolution
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { readFile, writeFile } from 'node:fs/promises';
          import { canonicalSha256, validateCheckpoint, validateResolution, validateRootOutcome } from './authority/controller/cloudflare-release-receipt.mjs';
          const digest = (value) => createHash('sha256').update(value).digest('hex');
          const reanchor = process.env.MODE === 'reanchor';
          const rootPath = reanchor ? 'reanchor/release-reanchor-outcome.json' : 'scan/selected-root.json';
          const activeRollbackBundle = JSON.parse(await readFile(rootPath, 'utf8'));
          validateRootOutcome(activeRollbackBundle);
          assert.equal(activeRollbackBundle.activeVersionId, process.env.ACTIVE_VERSION_ID);
          assert.equal(activeRollbackBundle.targetSha, process.env.VERIFIED_BUILD_SHA);
          const now = new Date();
          const expires = new Date(now.valueOf() + 90 * 24 * 60 * 60 * 1000);
          const checkpoint = {
            schemaVersion: 'lupi-release-checkpoint-v1',
            repository: 'alexwelcing/Lupi',
            targetSha: process.env.VERIFIED_BUILD_SHA,
            runId: process.env.GITHUB_RUN_ID,
            runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
            activeVersionId: process.env.ACTIVE_VERSION_ID,
            createdAt: now.toISOString(),
            expiresAt: expires.toISOString(),
            parentSha256: canonicalSha256(activeRollbackBundle),
            lastTrustedRelease: {
              source: reanchor ? 'owner-reanchor' : 'retained-root',
              controllerRunId: process.env.GITHUB_RUN_ID,
            },
            activeRollbackBundle,
            activeRollbackBundleSha256: canonicalSha256(activeRollbackBundle),
          };
          validateCheckpoint(checkpoint);
          await writeFile('checkpoint/release-checkpoint.json', `${JSON.stringify(checkpoint, null, 2)}\n`);
          if (process.env.MODE === 'reconcile-rollback') {
            const intentBytes = await readFile('rollback-intent/release-intent.json');
            const intent = JSON.parse(intentBytes);
            const incidentBytes = await readFile('rollback-incident/rollback-required.json');
            const commandBytes = await readFile('rollback-command/rollback-command.json');
            const beforeBytes = await readFile('scan/reconciliation-scan.json');
            const afterBytes = await readFile('verify/reconciliation-verification.json');
            const apiBytes = await readFile('ui/live-api.json');
            const uiBytes = await readFile('ui/ui-proof.json');
            const authorization = JSON.parse(await readFile('authority/authorization.json', 'utf8'));
            assert.equal(digest(intentBytes), process.env.INTENT_SHA256);
            assert.equal(digest(incidentBytes), process.env.INCIDENT_SHA256);
            const resolution = {
              schemaVersion: 'lupi-release-resolution-v1',
              repository: 'alexwelcing/Lupi',
              targetSha: intent.targetSha,
              sourceRunId: process.env.SOURCE_RUN_ID,
              sourceRunAttempt: 1,
              resolutionMode: 'owner-reconcile-rollback-v1',
              intentSha256: digest(intentBytes),
              incidentSha256: digest(incidentBytes),
              authorization,
              beforeStateSha256: digest(beforeBytes),
              commandResultSha256: digest(commandBytes),
              afterStateSha256: digest(afterBytes),
              priorContractSha256: canonicalSha256(activeRollbackBundle.rollbackContract),
              controlPlaneReportSha256: digest(afterBytes),
              apiReportSha256: digest(apiBytes),
              rollbackUiReportSha256: digest(uiBytes),
              completedAt: new Date().toISOString(),
            };
            validateResolution(resolution);
            await writeFile('resolution/release-resolution.json', `${JSON.stringify(resolution, null, 2)}\n`);
          }
          NODE
        env:
          MODE: ${{ inputs.mode }}
          ACTIVE_VERSION_ID: ${{ inputs.mode == 'reanchor' && inputs.active_version_id || needs.reconcile-verify.outputs.verified_active_version_id }}
          VERIFIED_BUILD_SHA: ${{ inputs.mode == 'reanchor' && inputs.active_build_sha || needs.reconcile-verify.outputs.verified_build_sha }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          INTENT_SHA256: ${{ inputs.intent_sha256 }}
          INCIDENT_SHA256: ${{ inputs.incident_sha256 }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-checkpoint-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: checkpoint
          if-no-files-found: error
          retention-days: 90

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ inputs.mode == 'reconcile-rollback' }}
        with:
          name: release-resolution-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: resolution
          if-no-files-found: error
          retention-days: 90
