name: ChatGPT widget checks

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - 'apps/chatgpt-widget/**'
      - 'apps/mcp-worker/src/chatgpt*'
      - 'apps/mcp-worker/src/discovery*'
      - 'packages/core/src/jev/**'
      - 'packages/core/src/omol25/**'
      - 'packages/core/src/bonds/**'
      - 'plugins/lupi-live/**'
      - 'tools/verify-chatgpt-inspection.mts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/chatgpt-widget.yml'

permissions:
  contents: read

concurrency:
  group: chatgpt-widget-${{ github.ref }}
  cancel-in-progress: true

jobs:
  widget:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test source estimation, picking, and tool contracts
        run: pnpm chatgpt:test
      - name: Build embedded UI and Worker
        run: pnpm chatgpt:build
      - name: Install browser runtime
        run: pnpm exec playwright install --with-deps chromium
      - name: Test hover and touch inspection in a sandboxed MCP host
        run: node --import tsx tools/verify-chatgpt-inspection.mts
      - name: Check development package
        run: pnpm chatgpt:package --check
