name: ChatGPT dependency update check

on:
  push:
    branches: [codex/chatgpt-omol-bonds-hover]
    paths: ['.github/workflows/chatgpt-dependency-check.yml']

permissions:
  contents: read

jobs:
  dependency-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Generate candidate manifest and lockfile without modifying the repository
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          Object.assign(pkg.pnpm.overrides, {
            'shell-quote@1.10.0': '1.11.0',
            'source-map-js@1.2.1': '1.2.2',
            'compression@1.8.1': '1.8.2',
            'sharp@0.35.0': '0.35.5',
            'sharp@0.35.4': '0.35.5'
          });
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE
          pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
          mkdir -p dependency-review
          cp package.json pnpm-lock.yaml dependency-review/
          git diff -- package.json pnpm-lock.yaml > dependency-review/update.patch
      - name: Audit the candidate dependencies
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: pnpm audit --prod --audit-level high
      - name: Upload candidate files for review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chatgpt-dependency-review
          path: dependency-review/
          if-no-files-found: error
          retention-days: 3
