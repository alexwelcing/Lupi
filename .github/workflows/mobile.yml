name: Mobile TestFlight source

# The Expo app's own check, only when the Expo app changes.
on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile.yml'
  workflow_dispatch: {}

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mobile-testflight-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node used by EAS production
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.1"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify lockfile executable metadata
        run: node tools/verify-pnpm-lock-bins.mjs

      - name: Install mobile dependency graph from the frozen lockfile
        run: pnpm install --frozen-lockfile --filter @lupi/mobile...

      - name: Verify mobile TestFlight source
        run: pnpm --filter @lupi/mobile verify:testflight
