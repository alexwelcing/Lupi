name: LUPI CI

# The merge gate, budgeted to be green within about five minutes of a push.
# Anything that does not need to block a merge lives elsewhere:
#   - the full Playwright regression -> ui-regression.yml (nightly, on demand,
#     and on pull requests that change the suite itself)
#   - production dependency audits    -> dependency-audit.yml (weekly, on
#     demand, and when a lockfile or manifest changes)
#   - release smoke on lupi.live      -> deploy-cloudflare.yml, after traffic
#     moves, against the real site
# A merge to main is live on lupi.live in about two minutes. This gate is the
# only thing a pull request waits on, so keep it lean: lint, contracts, build,
# unit tests, Worker and Cloud Functions tests, catalog drift.

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'functions/**'
      - 'docs/**'
      - 'tools/**'
      - 'scripts/**'
      - 'LUPINE.md'
      - 'README.md'
      - 'firebase.json'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - 'tsconfig*.json'
      - 'vitest.workspace.*'
      - 'eslint.config.*'
      - '.github/workflows/*.yml'
      - '.github/workflows/*.yaml'
      - '.github/wrangler-runtime/**'
      - '.easignore'
      - '.npmrc'
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'functions/**'
      - 'docs/**'
      - 'tools/**'
      - 'scripts/**'
      - 'LUPINE.md'
      - 'README.md'
      - 'firebase.json'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - 'tsconfig*.json'
      - 'vitest.workspace.*'
      - 'eslint.config.*'
      - '.github/workflows/*.yml'
      - '.github/workflows/*.yaml'
      - '.github/wrangler-runtime/**'
      - '.easignore'
      - '.npmrc'

concurrency:
  group: lupi-live-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify lockfile executable metadata
        run: node tools/verify-pnpm-lock-bins.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bootstrap checksum-pinned actionlint
        run: |
          version='1.7.12'
          archive="actionlint_${version}_linux_amd64.tar.gz"
          expected='8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
          root="$RUNNER_TEMP/actionlint"
          mkdir -p "$root"
          curl --fail --location --retry 3 \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/${archive}" \
            --output "$root/$archive"
          echo "$expected  $root/$archive" | sha256sum --check --strict
          tar -xzf "$root/$archive" -C "$root" actionlint
          echo "$root" >> "$GITHUB_PATH"

      - name: Validate GitHub workflow schemas
        run: pnpm verify:workflows

      - name: Test repository tooling
        run: |
          node --test \
            tools/run-actionlint.test.mjs \
            tools/verify-product-contract.test.mjs \
            tools/verify-cloudflare-live.test.mjs

      - name: Verify product contract
        run: pnpm verify:product-contract

      - name: Lint all workspaces and repository tooling
        run: pnpm lint

  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          VITE_LUPI_BUILD_SHA: ${{ github.sha }}
        run: pnpm build

      - name: Validate selective routing with the release-pinned Wrangler
        run: |
          npm ci --ignore-scripts --omit=dev --prefix .github/wrangler-runtime
          node .github/wrangler-runtime/node_modules/wrangler/bin/wrangler.js versions upload \
            --dry-run \
            --outdir .verify-artifacts/ci-worker-dry-run \
            --config apps/mcp-worker/wrangler.toml

      - name: Test
        run: pnpm test

      - name: Test Cloudflare Worker
        run: pnpm cloudflare:test

      # Cloud Functions are a standalone npm package (own lockfile, separate
      # Firebase deploy), so they're not in the pnpm/turbo workspace.
      - name: Install Cloud Functions dependencies
        working-directory: functions
        run: npm ci

      - name: Build Cloud Functions
        working-directory: functions
        run: npm run build

      - name: Test Cloud Functions
        working-directory: functions
        run: npm test

      - name: Rebuild catalog and fail on drift
        run: |
          npm run nist:build
          if ! git -C "$GITHUB_WORKSPACE" diff --quiet -- apps/web/public/nist; then
            echo "::error::Committed NIST catalog is stale. Run 'npm run nist:build' and commit the result."
            git -C "$GITHUB_WORKSPACE" diff -- apps/web/public/nist
            exit 1
          fi
          echo "NIST catalog is in sync with committed source."

  mobile-testflight-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # Only pull requests can be scoped; pushes to main and manual runs
      # always verify. Comparing trees needs no shared history, so a
      # depth-1 fetch of the base commit is enough.
      - name: Decide whether the mobile app could have changed
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "${BASE_SHA}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "${BASE_SHA}"
          if git diff --quiet "${BASE_SHA}" HEAD -- \
            apps/mobile package.json pnpm-lock.yaml pnpm-workspace.yaml .github/workflows/ci.yml
          then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No mobile source, manifest or lockfile change; skipping TestFlight source verification."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        if: steps.changed.outputs.run == 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node used by EAS production
        if: steps.changed.outputs.run == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.1"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify lockfile executable metadata
        if: steps.changed.outputs.run == 'true'
        run: node tools/verify-pnpm-lock-bins.mjs

      - name: Install mobile dependency graph from the frozen lockfile
        if: steps.changed.outputs.run == 'true'
        run: pnpm install --frozen-lockfile --filter @lupi/mobile...

      - name: Verify mobile TestFlight source
        if: steps.changed.outputs.run == 'true'
        run: pnpm --filter @lupi/mobile verify:testflight
