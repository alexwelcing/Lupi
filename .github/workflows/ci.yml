name: LUPI CI

# One check on pull requests: would the deploy build? The same build and
# Worker bundle as deploy-cloudflare.yml, minus the upload (about 3 min).
# A push to main is the release and waits on nothing. Tests, lint, audits,
# Playwright and the verifiers are local tools, run when they help.
on:
  pull_request: {}
  workflow_dispatch: {}

concurrency:
  group: lupi-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The name is the required check of the main ruleset: keep it.
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          VITE_LUPI_BUILD_SHA: ${{ github.sha }}
        run: pnpm build

      - name: Bundle the Worker with the pinned Wrangler (dry run)
        run: |
          npm ci --ignore-scripts --omit=dev --prefix .github/wrangler-runtime
          node .github/wrangler-runtime/node_modules/wrangler/bin/wrangler.js versions upload \
            --dry-run \
            --outdir .verify-artifacts/ci-worker-dry-run \
            --config apps/mcp-worker/wrangler.toml
