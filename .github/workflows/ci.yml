name: LUPI CI

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'functions/**'
      - 'docs/**'
      - 'tools/**'
      - 'tests/**'
      - 'scripts/**'
      - 'LUPINE.md'
      - 'README.md'
      - 'firebase.json'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - 'tsconfig*.json'
      - 'vitest.workspace.*'
      - 'eslint.config.*'
      - 'playwright.config.mjs'
      - '.github/workflows/*.yml'
      - '.github/workflows/*.yaml'
      - '.github/wrangler-runtime/**'
      - '.easignore'
      - '.npmrc'
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'functions/**'
      - 'docs/**'
      - 'tools/**'
      - 'tests/**'
      - 'scripts/**'
      - 'LUPINE.md'
      - 'README.md'
      - 'firebase.json'
      - 'firestore.rules'
      - 'firestore.indexes.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - 'tsconfig*.json'
      - 'vitest.workspace.*'
      - 'eslint.config.*'
      - 'playwright.config.mjs'
      - '.github/workflows/*.yml'
      - '.github/workflows/*.yaml'
      - '.github/wrangler-runtime/**'
      - '.easignore'
      - '.npmrc'

concurrency:
  group: lupi-live-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mobile-testflight-source:
    runs-on: ubuntu-latest
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node used by EAS production
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20.19.4"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install mobile dependency graph from the frozen lockfile
        run: pnpm install --frozen-lockfile --filter @lupi/mobile...

      - name: Verify mobile TestFlight source
        run: pnpm --filter @lupi/mobile verify:testflight

  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bootstrap checksum-pinned actionlint
        run: |
          version='1.7.12'
          archive="actionlint_${version}_linux_amd64.tar.gz"
          expected='8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
          root="$RUNNER_TEMP/actionlint"
          mkdir -p "$root"
          curl --fail --location --retry 3 \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/${archive}" \
            --output "$root/$archive"
          echo "$expected  $root/$archive" | sha256sum --check --strict
          tar -xzf "$root/$archive" -C "$root" actionlint
          echo "$root" >> "$GITHUB_PATH"

      - name: Validate GitHub workflow schemas
        run: pnpm verify:workflows

      - name: Test actionlint compatibility filter
        run: node --test tools/run-actionlint.test.mjs

      - name: Test product contract verifier
        run: node --test tools/verify-product-contract.test.mjs

      - name: Verify product contract
        run: pnpm verify:product-contract

      - name: Lint all workspaces and repository tooling
        run: pnpm lint

      - name: Gate root production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Test Cloudflare live verifier
        run: node --test tools/verify-cloudflare-live.test.mjs

      - name: Test Cloudflare release receipts
        run: node --test tools/cloudflare-release-receipt.test.mjs

      - name: Test Cloudflare release authority
        run: node --test tools/cloudflare-release-authority.test.mjs

      - name: Test Cloudflare workflow contract
        run: node --test tools/cloudflare-release-workflow.test.mjs

      - name: Test Cloudflare release package builder
        run: node --test tools/build-cloudflare-release-package.test.mjs

      - name: Build
        env:
          VITE_LUPI_BUILD_SHA: ${{ github.sha }}
        run: pnpm build

      - name: Validate selective routing with the release-pinned Wrangler
        run: |
          npm ci --ignore-scripts --omit=dev --prefix .github/wrangler-runtime
          node .github/wrangler-runtime/node_modules/wrangler/bin/wrangler.js versions upload \
            --dry-run \
            --outdir .verify-artifacts/ci-worker-dry-run \
            --config apps/mcp-worker/wrangler.toml

      - name: Test
        run: pnpm test

      # Cloud Functions are a standalone npm package (own lockfile, separate
      # Firebase deploy), so they're not in the pnpm/turbo workspace. Gate their
      # security-adjacent tests (keygen, rate limiting, social meta) in isolation.
      - name: Install Cloud Functions dependencies
        working-directory: functions
        run: npm ci

      - name: Gate Cloud Functions production dependencies
        working-directory: functions
        run: npm audit --omit=dev --audit-level=high

      - name: Build Cloud Functions
        working-directory: functions
        run: npm run build

      - name: Test Cloud Functions
        working-directory: functions
        run: npm test

      - name: Test Cloudflare Worker
        run: pnpm cloudflare:test

      - name: Rebuild catalog and fail on drift
        run: |
          npm run nist:build
          if ! git -C "$GITHUB_WORKSPACE" diff --quiet -- apps/web/public/nist; then
            echo "::error::Committed NIST catalog is stale. Run 'npm run nist:build' and commit the result."
            git -C "$GITHUB_WORKSPACE" diff -- apps/web/public/nist
            exit 1
          fi
          echo "NIST catalog is in sync with committed source."

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Test production UI
        run: pnpm test:ui

      - name: Upload Playwright diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
